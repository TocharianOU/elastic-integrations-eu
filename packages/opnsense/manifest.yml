format_version: 3.3.2
name: opnsense
title: OPNsense
version: "0.1.0"
description: Collect firewall logs from OPNsense with Elastic Agent.
type: integration
categories:
  - security
  - network
conditions:
  kibana:
    version: "^8.18.0 || ^9.0.0"
  elastic:
    subscription: basic
icons:
  - src: /img/opnsense-logo.svg
    title: OPNsense
    size: 512x512
    type: image/svg+xml
policy_templates:
  - name: opnsense
    title: OPNsense logs
    description: Collect OPNsense firewall logs.
    inputs:
      - type: udp
        title: Collect OPNsense logs over UDP
        description: >-
          Receive syslog from OPNsense over UDP. This matches OPNsense's default
          remote logging transport.
      - type: tcp
        title: Collect OPNsense logs over TCP
        description: >-
          Receive syslog from OPNsense over TCP, for delivery guarantees or
          messages larger than the network MTU.
      - type: logfile
        title: Read OPNsense logs from a file
        description: Read OPNsense syslog from a file, one message per line.
owner:
  github: TocharianOU
  type: community
source:
  license: "Apache-2.0"
