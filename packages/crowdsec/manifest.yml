format_version: 3.3.2
name: crowdsec
title: CrowdSec
version: "0.1.0"
description: Collect alerts and remediation decisions from CrowdSec via Elastic Agent.
type: integration
categories:
  - security
  - network
conditions:
  kibana:
    version: "^8.18.0 || ^9.0.0"
  elastic:
    subscription: basic
icons:
  - src: /img/crowdsec-logo.svg
    title: CrowdSec
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: crowdsec
    title: CrowdSec alerts
    description: Collect CrowdSec alerts and decisions.
    inputs:
      - type: http_endpoint
        title: Receive alerts from the CrowdSec HTTP notification plugin
        description: >-
          Listen for alerts pushed by CrowdSec's notification-http plugin. This is
          the real-time path and requires no credentials on the Agent side.
      - type: logfile
        title: Read alerts from a file
        description: >-
          Read CrowdSec alerts from a file, one JSON alert object per line. Useful
          for replaying captured alerts.
owner:
  github: TocharianOU
  type: community
source:
  license: "Apache-2.0"
